[project]
name = "rsdiff"
dynamic = ["version"]
description = "Text-to-satellite-image diffusion: the RSDiff cascade (NCAA 2024), released weights, and its FID/CLIP evaluation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Ahmad Sebaq", email = "ahmad.sebaq@gmail.com" }]
keywords = ["diffusion", "text-to-image", "remote-sensing", "satellite", "imagen", "rsicd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    # The released checkpoint was trained and saved with imagen-pytorch 2.1.0.
    "imagen-pytorch==2.1.0",
    # imagen-pytorch's T5 helper calls tokenizer.batch_encode_plus, removed in transformers 5.
    "transformers>=4.44,<5",
    "huggingface-hub>=0.25",
    "omegaconf>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "Pillow>=10.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# FID; CLIP score only needs the core dependencies.
eval = ["torchmetrics[image]>=1.4"]

[project.scripts]
rsdiff = "rsdiff.cli:main"

[project.urls]
Homepage = "https://github.com/asebaq/rsdiff"
Documentation = "https://asebaq.github.io/rsdiff"
Issues = "https://github.com/asebaq/rsdiff/issues"
Changelog = "https://github.com/asebaq/rsdiff/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.1007/s00521-024-10363-3"
Weights = "https://huggingface.co/asebaq/rsdiff-sr-cascade-ep650"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "torchmetrics[image]>=1.4"]
docs = ["mkdocs-material>=9.5", "pymdown-extensions>=10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rsdiff/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src/rsdiff", "/tests", "/CHANGELOG.md", "/CITATION.cff", "/NOTICE", "/README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/rsdiff"]

# CPU-only torch for the lockfile on Linux keeps CI fast; pip users get the normal wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Frozen reference implementation (sys.path imports, original training loops); it is
# deleted once the packaged sampler reproduces its metrics, so it is not refactored.
"ddpm/**" = ["E402", "E501", "B007", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
